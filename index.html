<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>QuizSmart · Bible Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <h1>📘 QuizSmart <span>Bible</span></h1>
    <div class="subhead">Select a verse range, then start quizzing!</div>

    <!-- ========== FILTER / START AREA ========== -->
    <div id="filterPanel" class="filter-section">
      <div class="filter-grid">
        <div class="filter-item">
          <label for="startChapter">Start chapter</label>
          <select id="startChapter" aria-label="Start chapter"></select>
        </div>
        <div class="filter-item">
          <label for="startVerse">Start verse</label>
          <select id="startVerse" aria-label="Start verse"></select>
        </div>
        <div class="filter-item">
          <label for="endChapter">End chapter</label>
          <select id="endChapter" aria-label="End chapter"></select>
        </div>
        <div class="filter-item">
          <label for="endVerse">End verse</label>
          <select id="endVerse" aria-label="End verse"></select>
        </div>
      </div>
      <button id="startQuizBtn" class="start-btn" disabled>
        <span class="icon">▶</span> Start Quizzing!
      </button>
    </div>

    <!-- ========== LOADING / ERROR ========== -->
    <div id="loadingIndicator" class="loading">📥 Loading quiz data…</div>
    <div id="errorContainer" class="error-msg hidden"></div>

    <!-- ========== QUIZ DISPLAY ========== -->
    <div id="quizPanel" class="quiz-section">
      <!-- card -->
      <div class="quiz-card">
        <div class="question-meta">
          <span class="badge-type" id="qType">—</span>
          <span class="badge-verse" id="qVerse">—</span>
        </div>
        <div class="question-text" id="qText">—</div>
        <div id="answerContainer" class="answer-box hidden">
          <div class="answer-label">Answer</div>
          <div class="answer-content" id="aText">—</div>
        </div>

        <div class="action-row">
          <button id="speakBtn" class="speaker-btn" aria-label="Read question aloud">
            <span class="icon">🔊</span> Read
          </button>
          <button id="showAnswerBtn" class="show-answer-btn hidden-answer">
            <span class="icon">🔍</span> Show Answer
          </button>
        </div>
      </div>

      <!-- navigation -->
      <div class="nav-row">
        <button id="prevBtn" class="nav-btn" disabled>◀ Previous</button>
        <button id="nextBtn" class="nav-btn">Next ▶</button>
      </div>

      <!-- progress -->
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <div id="progressText" class="progress-text">0 / 0</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
